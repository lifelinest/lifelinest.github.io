<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签分页展示</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 卡片容器样式 */
        .card-widget {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            max-width: 600px;
        }
        
        /* 标签区域标题 */
        .item-headline {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #333;
        }
        
        /* 分页标签容器 */
        .tag-pagination-container {
            position: relative;
            min-height: 250px;
        }
        
        /* 标签网格布局 */
        .tag-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(5, auto);
            gap: 0;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            overflow: hidden;
        }
        
        /* 标签项样式 */
        .tag-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            transition: all 0.3s ease;
            position: relative;
            border-right: 1px solid #e9ecef;
            border-bottom: 1px solid #e9ecef;
        }
        
        /* 为右侧列的标签移除右侧边框 */
        .tag-item:nth-child(2n) {
            border-right: none;
        }
        
        /* 为最后两行标签移除底部边框 */
        .tag-item:nth-last-child(1),
        .tag-item:nth-last-child(2) {
            border-bottom: none;
        }
        
        /* 当标签数量不足10个时的处理 */
        .tag-grid:has(.tag-item:nth-child(n+9):nth-child(-n+10)) .tag-item:nth-child(9),
        .tag-grid:has(.tag-item:nth-child(n+9):nth-child(-n+10)) .tag-item:nth-child(10) {
            border-bottom: none;
        }
        
        /* 在标签之间添加更明显的分隔线效果 */
        .tag-item::before {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 60%;
            width: 1px;
            background: linear-gradient(to bottom, transparent, #dee2e6, transparent);
            display: none;
        }
        
        .tag-item:nth-child(2n)::before {
            display: block;
        }
        
        /* 响应式调整分隔线 */
        @media (max-width: 768px) {
            .tag-item::before {
                display: none !important;
            }
            
            .tag-item,
            .tag-item:nth-child(2n) {
                border-right: none;
                border-bottom: 1px solid #e9ecef;
            }
            
            .tag-item:last-child {
                border-bottom: none;
            }
        }
        
        .tag-item:hover {
            background: #e9ecef;
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* 标签链接样式 */
        .tag-link {
            text-decoration: none;
            color: #495057;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        
        .tag-link:hover {
            color: #007bff;
        }
        
        /* 标签计数样式 */
        .tag-count {
            font-size: 12px;
            color: #6c757d;
            background: #dee2e6;
            padding: 2px 6px;
            border-radius: 10px;
        }
        
        /* 分页控制按钮容器 */
        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 24px;
            gap: 16px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        
        /* 分页按钮样式 */
        .pagination-btn {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        
        /* 按钮悬停效果 */
        .pagination-btn:hover:not(:disabled) {
            background: #0056b3;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }
        
        /* 按钮点击效果 */
        .pagination-btn:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(0, 123, 255, 0.3);
        }
        
        /* 按钮禁用状态 */
        .pagination-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
            box-shadow: none;
        }
        
        /* 按钮图标增强 */
        .pagination-btn i {
            font-size: 16px;
            transition: transform 0.2s ease;
        }
        
        .pagination-btn:hover:not(:disabled) i {
            transform: scale(1.1);
        }
        
        /* 添加按钮点击波纹效果 */
        .pagination-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .pagination-btn:active:not(:disabled)::after {
            width: 300px;
            height: 300px;
        }
        
        /* 页码信息 */
        .page-info {
            font-size: 14px;
            color: #6c757d;
        }
        
        /* 页面指示器 */
        .page-indicators {
            display: flex;
            gap: 4px;
        }
        
        .page-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #dee2e6;
            transition: all 0.3s ease;
        }
        
        .page-indicator.active {
            background: #007bff;
            transform: scale(1.2);
        }
        
        /* 响应式设计 - 平板设备 (768px - 991px) */
        @media (max-width: 991px) {
            .card-widget {
                padding: 18px;
                margin: 15px;
                max-width: calc(100% - 30px);
            }
            
            .item-headline {
                font-size: 17px;
                margin-bottom: 14px;
            }
            
            .tag-item {
                padding: 10px 14px;
            }
            
            .tag-link {
                font-size: 15px;
            }
            
            .pagination-btn {
                padding: 9px 18px;
                font-size: 13px;
            }
        }
        
        /* 响应式设计 - 移动设备 (767px 以下) */
        @media (max-width: 767px) {
            .card-widget {
                padding: 16px;
                margin: 10px;
                max-width: calc(100% - 20px);
                box-shadow: 0 1px 8px rgba(0, 0, 0, 0.08);
            }
            
            .item-headline {
                font-size: 16px;
                margin-bottom: 12px;
            }
            
            /* 单列布局 */
            .tag-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                min-height: 0;
            }
            
            /* 移除单列布局中的右侧边框 */
            .tag-item {
                border-right: none !important;
                border-bottom: 1px solid #e9ecef;
                padding: 10px 12px;
                min-height: 48px;
            }
            
            /* 仅最后一个标签项不显示底部边框 */
            .tag-item:last-child {
                border-bottom: none !important;
            }
            
            /* 移除单列布局中的伪元素分隔线 */
            .tag-item::before {
                display: none !important;
            }
            
            .tag-link {
                font-size: 14px;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
            
            .tag-count {
                font-size: 11px;
                padding: 1px 5px;
                min-width: 20px;
                text-align: center;
            }
            
            /* 重新排列分页控制元素 */
            .pagination-controls {
                flex-direction: column;
                gap: 12px;
                padding: 12px;
                margin-top: 20px;
            }
            
            /* 移动端的按钮容器 */
            .pagination-controls {
                display: grid;
                grid-template-areas:
                    "prev next"
                    "info info"
                    "indicators indicators";
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            
            #prevBtn {
                grid-area: prev;
            }
            
            #nextBtn {
                grid-area: next;
            }
            
            .page-info {
                grid-area: info;
                text-align: center;
                order: 2;
            }
            
            .page-indicators {
                grid-area: indicators;
                justify-content: center;
                order: 3;
            }
            
            .pagination-btn {
                padding: 8px 16px;
                font-size: 13px;
                min-width: 0;
                justify-content: center;
            }
            
            /* 简化按钮图标显示 */
            .pagination-btn i {
                font-size: 14px;
            }
            
            .page-info {
                font-size: 13px;
                margin: 0;
            }
        }
        
        /* 响应式设计 - 小型手机 (480px 以下) */
        @media (max-width: 480px) {
            .card-widget {
                padding: 12px;
                margin: 6px;
                max-width: calc(100% - 12px);
                border-radius: 6px;
            }
            
            .item-headline {
                font-size: 15px;
                margin-bottom: 10px;
            }
            
            .tag-item {
                padding: 8px 10px;
                min-height: 44px;
            }
            
            .tag-link {
                font-size: 13px;
            }
            
            .tag-count {
                font-size: 10px;
                padding: 1px 4px;
            }
            
            .pagination-controls {
                gap: 8px;
                padding: 10px;
                margin-top: 16px;
            }
            
            .pagination-btn {
                padding: 7px 12px;
                font-size: 12px;
                gap: 4px;
            }
            
            .page-info {
                font-size: 12px;
            }
            
            .page-indicators {
                gap: 3px;
            }
            
            .page-indicator {
                width: 7px;
                height: 7px;
            }
        }
        
        /* 高对比度模式支持 */
        @media (prefers-contrast: high) {
            .card-widget {
                background: #fff;
                color: #000;
                border: 2px solid #000;
                box-shadow: none;
            }
            
            .tag-grid {
                border: 2px solid #000;
            }
            
            .tag-item {
                background: #f0f0f0;
                border-color: #000;
            }
            
            .tag-link {
                color: #000;
            }
            
            .tag-link:hover {
                color: #0000cc;
            }
            
            .tag-count {
                background: #ccc;
                color: #000;
                border: 1px solid #000;
            }
            
            .pagination-btn {
                background: #000;
                color: #fff;
                border: 2px solid #000;
            }
            
            .pagination-btn:hover:not(:disabled) {
                background: #0000cc;
                border-color: #0000cc;
            }
            
            .pagination-btn:disabled {
                background: #ccc;
                color: #666;
                border-color: #666;
            }
            
            .page-indicator {
                background: #ccc;
                border: 1px solid #000;
            }
            
            .page-indicator.active {
                background: #000;
            }
        }
        
        /* 减少动画偏好支持 */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
                transform: none !important;
            }
            
            .tag-grid {
                transition: none !important;
            }
            
            .tag-item {
                transition: none !important;
            }
            
            .tag-link:hover {
                transform: none !important;
            }
            
            .pagination-btn {
                transition: none !important;
            }
            
            .pagination-btn:hover:not(:disabled) {
                transform: none !important;
                box-shadow: none !important;
            }
            
            .pagination-btn:hover:not(:disabled) i {
                transform: none !important;
            }
            
            .page-indicator {
                transition: none !important;
            }
            
            .page-indicator.active {
                transform: none !important;
            }
        }
        
        /* 暗色模式支持 */
        @media (prefers-color-scheme: dark) {
            .card-widget {
                background: #1f1f1f;
                color: #e0e0e0;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            }
            
            .item-headline {
                color: #ffffff;
            }
            
            .tag-grid {
                border-color: #444;
            }
            
            .tag-item {
                background: #2a2a2a;
                border-color: #444;
            }
            
            .tag-item:hover {
                background: #333;
            }
            
            .tag-link {
                color: #e0e0e0;
            }
            
            .tag-link:hover {
                color: #4dabf7;
            }
            
            .tag-count {
                background: #444;
                color: #ccc;
            }
            
            .pagination-controls {
                background: #2a2a2a;
                border-color: #444;
            }
            
            .page-info {
                color: #ccc;
            }
            
            .page-indicator {
                background: #444;
            }
            
            .page-indicator.active {
                background: #4dabf7;
            }
            
            .pagination-btn {
                background: #495057;
                color: #fff;
            }
            
            .pagination-btn:hover:not(:disabled) {
                background: #343a40;
            }
        }
    </style>
</head>

            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const currentPageEl = document.getElementById('currentPage');
            const totalPagesEl = document.getElementById('totalPages');
            const pageIndicators = document.getElementById('pageIndicators');
            const paginationContainer = document.querySelector('.tag-pagination-container');
            
            // 计算总页数
            const totalPages = Math.ceil(tagData.length / itemsPerPage);
            
            // 初始化CSS过渡
            tagGrid.style.transition = 'all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1)';
            
            // 更新分页信息
            function updatePaginationInfo() {
                // 数字变化动画
                const animateNumber = (element, target) => {
                    const start = parseInt(element.textContent);
                    const diff = target - start;
                    const duration = 300;
                    const startTime = performance.now();
                    
                    function animate(timestamp) {
                        const elapsed = timestamp - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const easeProgress = 1 - Math.pow(1 - progress, 3); // 缓动函数
                        const current = Math.floor(start + diff * easeProgress);
                        
                        element.textContent = current;
                        
                        if (progress < 1) {
                            requestAnimationFrame(animate);
                        } else {
                            element.textContent = target;
                        }
                    }
                    
                    requestAnimationFrame(animate);
                };
                
                // 更新页码数字（带动画）
                animateNumber(currentPageEl, currentPage);
                
                // 更新总页数（如果需要）
                if (parseInt(totalPagesEl.textContent) !== totalPages) {
                    totalPagesEl.textContent = totalPages;
                }
                
                // 更新按钮状态并添加过渡效果
                setTimeout(() => {
                    prevBtn.disabled = currentPage === 1;
                    nextBtn.disabled = currentPage === totalPages;
                }, 10);
                
                // 更新页面指示器
                updatePageIndicators();
            }
            
            // 更新页面指示器
            function updatePageIndicators() {
                // 移除所有旧的指示器
                while (pageIndicators.firstChild) {
                    pageIndicators.removeChild(pageIndicators.firstChild);
                }
                
                // 创建新的指示器
                for (let i = 1; i <= totalPages; i++) {
                    const indicator = document.createElement('div');
                    indicator.classList.add('page-indicator');
                    indicator.dataset.page = i;
                    
                    // 添加无障碍属性
                    indicator.setAttribute('aria-label', `前往第 ${i} 页`);
                    indicator.setAttribute('role', 'button');
                    indicator.setAttribute('tabindex', '0');
                    
                    // 添加点击事件
                    indicator.addEventListener('click', function() {
                        goToPage(i);
                    });
                    
                    // 添加键盘事件支持
                    indicator.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            goToPage(i);
                        }
                    });
                    
                    pageIndicators.appendChild(indicator);
                }
                
                // 使用setTimeout确保DOM已更新
                setTimeout(() => {
                    // 更新活动指示器状态，使用CSS过渡
                    const indicators = pageIndicators.querySelectorAll('.page-indicator');
                    indicators.forEach((indicator, index) => {
                        if (parseInt(indicator.dataset.page) === currentPage) {
                            indicator.classList.add('active');
                        } else {
                            indicator.classList.remove('active');
                        }
                    });
                }, 0);
            }
            
            // 跳转到指定页面
            function goToPage(pageNum) {
                // 防止动画过程中重复触发
                if (isAnimating || pageNum === currentPage) return;
                
                isAnimating = true;
                const direction = pageNum > currentPage ? 'left' : 'right';
                
                // 保存旧页面
                currentPage = pageNum;
                
                // 添加滑动动画
                tagGrid.style.transform = direction === 'left' ? 'translateX(-100%)' : 'translateX(100%)';
                tagGrid.style.opacity = '0.5';
                
                // 在下一帧执行页面切换
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        // 渲染新页面
                        renderCurrentPage();
                        
                        // 重置位置并添加淡入效果
                        tagGrid.style.transform = 'translateX(0)';
                        tagGrid.style.opacity = '1';
                        
                        // 更新分页信息
                        updatePaginationInfo();
                        
                        // 动画结束后重置标志
                        setTimeout(() => {
                            isAnimating = false;
                        }, 400); // 与CSS过渡时间匹配
                    }, 200);
                });
            }
            
            // 渲染当前页面的标签
            function renderCurrentPage() {
                // 清空容器
                tagGrid.innerHTML = '';
                
                // 计算当前页面的标签起始和结束索引
                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = Math.min(startIndex + itemsPerPage, tagData.length);
                
                // 获取当前页面的标签数据
                const currentPageTags = tagData.slice(startIndex, endIndex);
                
                // 批量创建标签元素以提高性能
                const fragment = document.createDocumentFragment();
                
                currentPageTags.forEach((tag, index) => {
                    const tagItem = document.createElement('div');
                    tagItem.classList.add('tag-item');
                    
                    // 为SEO和无障碍性添加data属性
                    tagItem.setAttribute('data-tag-name', tag.name);
                    tagItem.setAttribute('data-tag-count', tag.count);
                    
                    const tagLink = document.createElement('a');
                    tagLink.classList.add('tag-link');
                    tagLink.href = tag.href;
                    tagLink.title = `${tag.name} (${tag.count}篇文章)`;
                    tagLink.setAttribute('aria-label', `${tag.name}，共${tag.count}篇文章`);
                    
                    // 创建标签名称和数量
                    const tagNameSpan = document.createElement('span');
                    tagNameSpan.textContent = tag.name;
                    
                    const tagCountSup = document.createElement('sup');
                    tagCountSup.textContent = tag.count;
                    
                    // 添加计数元素
                    const countSpan = document.createElement('span');
                    countSpan.classList.add('tag-count');
                    countSpan.textContent = tag.count;
                    
                    // 组合元素
                    tagLink.appendChild(tagNameSpan);
                    tagLink.appendChild(tagCountSup);
                    tagLink.appendChild(countSpan);
                    tagItem.appendChild(tagLink);
                    fragment.appendChild(tagItem);
                    
                    // 为标签项添加动画延迟
                    setTimeout(() => {
                        tagItem.style.opacity = '0';
                        tagItem.style.transform = 'translateY(10px)';
                        tagItem.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                        
                        setTimeout(() => {
                            tagItem.style.opacity = '1';
                            tagItem.style.transform = 'translateY(0)';
                        }, 50 + index * 30); // 错开动画时间
                    }, 0);
                });
                
                // 一次性添加到DOM
                tagGrid.appendChild(fragment);
                
                // 处理最后一页标签数量不足时的边框问题
                const tagItems = tagGrid.querySelectorAll('.tag-item');
                const itemCount = tagItems.length;
                
                if (itemCount > 0) {
                    // 移除最后一行的底部边框
                    if (itemCount % 2 === 0) {
                        tagItems[itemCount - 1].style.borderBottom = 'none';
                        tagItems[itemCount - 2].style.borderBottom = 'none';
                    } else {
                        tagItems[itemCount - 1].style.borderBottom = 'none';
                    }
                }
            }
            
            // 添加事件委托以提高性能
            paginationContainer.addEventListener('click', function(e) {
                // 处理上一页按钮
                if (prevBtn.contains(e.target) && currentPage > 1 && !isAnimating) {
                    goToPage(currentPage - 1);
                }
                // 处理下一页按钮
                else if (nextBtn.contains(e.target) && currentPage < totalPages && !isAnimating) {
                    goToPage(currentPage + 1);
                }
            });
            
            // 为按钮添加键盘焦点样式支持
            [prevBtn, nextBtn].forEach(btn => {
                btn.addEventListener('focus', function() {
                    this.style.outline = '2px solid #0056b3';
                    this.style.outlineOffset = '2px';
                });
                
                btn.addEventListener('blur', function() {
                    this.style.outline = 'none';
                    this.style.outlineOffset = '0';
                });
            });
            
            // 增强的键盘导航支持
            document.addEventListener('keydown', function(event) {
                // 仅在焦点不在输入元素上时处理
                if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                    return;
                }
                
                // 左右箭头导航
                if (event.key === 'ArrowLeft' && currentPage > 1 && !isAnimating) {
                    event.preventDefault();
                    goToPage(currentPage - 1);
                    // 设置焦点到上一页按钮
                    prevBtn.focus();
                } 
                else if (event.key === 'ArrowRight' && currentPage < totalPages && !isAnimating) {
                    event.preventDefault();
                    goToPage(currentPage + 1);
                    // 设置焦点到下一页按钮
                    nextBtn.focus();
                }
                // 支持Home/End键导航
                else if (event.key === 'Home' && !isAnimating) {
                    event.preventDefault();
                    goToPage(1);
                }
                else if (event.key === 'End' && !isAnimating) {
                    event.preventDefault();
                    goToPage(totalPages);
                }
                // 支持数字键1-9快速导航
                else if (event.key >= '1' && event.key <= '9' && !isAnimating) {
                    const targetPage = parseInt(event.key);
                    if (targetPage <= totalPages) {
                        event.preventDefault();
                        goToPage(targetPage);
                    }
                }
            });
            
            // 增强的触摸滑动支持
            let touchStartX = 0;
            let touchStartTime = 0;
            let touchEndX = 0;
            let touchMoved = false;
            
            // 触摸开始
            tagGrid.addEventListener('touchstart', function(e) {
                touchStartX = e.touches[0].screenX;
                touchStartTime = Date.now();
                touchMoved = false;
                // 防止触摸时的文本选择
                e.preventDefault();
            }, { passive: false });
            
            // 触摸移动
            tagGrid.addEventListener('touchmove', function(e) {
                if (!touchMoved) {
                    const currentX = e.touches[0].screenX;
                    const diff = Math.abs(currentX - touchStartX);
                    // 只有当移动超过5px时才认为是滑动
                    if (diff > 5) {
                        touchMoved = true;
                    }
                }
                
                // 如果正在滑动，可以添加视差效果
                if (touchMoved && !isAnimating) {
                    const currentX = e.touches[0].screenX;
                    const diff = currentX - touchStartX;
                    const movePercentage = Math.max(-30, Math.min(30, diff / 10));
                    
                    tagGrid.style.transform = `translateX(${movePercentage}px)`;
                    tagGrid.style.opacity = 1 - Math.abs(movePercentage) / 100;
                }
            }, { passive: false });
            
            // 触摸结束
            tagGrid.addEventListener('touchend', function(e) {
                if (!touchMoved) return;
                
                touchEndX = e.changedTouches[0].screenX;
                const touchDuration = Date.now() - touchStartTime;
                handleSwipe(touchDuration);
                
                // 重置变换状态
                if (!isAnimating) {
                    tagGrid.style.transform = 'translateX(0)';
                    tagGrid.style.opacity = '1';
                }
            });
            
            // 处理滑动
            function handleSwipe(duration) {
                const swipeDistance = touchEndX - touchStartX;
                const swipeThreshold = 50;
                const quickSwipeThreshold = 200; // 快速滑动的时间阈值（毫秒）
                const quickSwipeDistance = 30; // 快速滑动的距离阈值
                
                // 检测是否为快速滑动
                const isQuickSwipe = duration < quickSwipeThreshold && 
                                   Math.abs(swipeDistance) > quickSwipeDistance;
                
                // 普通滑动或快速滑动
                if (swipeDistance < -swipeThreshold || (isQuickSwipe && swipeDistance < 0)) {
                    // 向左滑动，显示下一页
                    if (currentPage < totalPages) {
                        goToPage(currentPage + 1);
                    }
                } 
                else if (swipeDistance > swipeThreshold || (isQuickSwipe && swipeDistance > 0)) {
                    // 向右滑动，显示上一页
                    if (currentPage > 1) {
                        goToPage(currentPage - 1);
                    }
                }
            }
            
            // 防抖函数
            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }
            
            // 使用防抖优化窗口调整事件
            const debouncedResize = debounce(() => {
                // 根据屏幕宽度调整每页显示的标签数量
                const isMobile = window.innerWidth <= 768;
                
                // 重新渲染当前页面以适应新的布局
                renderCurrentPage();
                
                // 触发重排以确保布局正确
                void tagGrid.offsetHeight;
            }, 250);
            
            // 添加窗口大小变化时的响应式调整
            window.addEventListener('resize', debouncedResize);
            
            // 添加页面可见性变化监听，暂停动画以节省资源
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    isAnimating = true; // 暂停动画
                } else {
                    // 页面重新可见时，恢复动画状态
                    setTimeout(() => {
                        isAnimating = false;
                    }, 100);
                }
            });
            
            // 初始化页面
            renderCurrentPage();
            updatePaginationInfo();
        });
    </script>
</body>
</html>
