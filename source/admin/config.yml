backend:
  name: git-gateway
  branch: main # 根据您的默认分支调整
  repo: lifelinest/lifelinest.github.io # GitHub仓库地址

media_folder: "source/images" # 媒体文件存储位置
public_folder: "/images" # 公开访问路径

locale: zh-Hans # 中文界面

# 网站基本信息
site_url: https://lifelinest.github.io # 网站URL
logo_url: /images/logo.png # 管理界面logo

# 编辑器配置
editor:
  preview: true

# 集合配置
collections:
  # 博客文章
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "source/_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "posts/{{abbrlink}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime"}
      - {label: "更新日期", name: "updated", widget: "datetime", required: false}
      - {label: "文章分类", name: "categories", widget: "list", required: false}
      - {label: "标签", name: "tags", widget: "list", required: false}
      - {label: "关键词", name: "keywords", widget: "string", required: false}
      - {label: "描述", name: "description", widget: "text", required: false}
      - {label: "封面图片", name: "cover", widget: "image", required: false}
      - {label: "置顶", name: "top", widget: "boolean", default: false, required: false}
      - {label: "评论", name: "comments", widget: "boolean", default: true, required: false}
      - {label: "abbrlink", name: "abbrlink", widget: "string", required: false}
      - {label: "内容", name: "body", widget: "markdown"}

  # 页面
  - name: "pages"
    label: "页面"
    label_singular: "页面"
    folder: "source"
    create: true
    filter: {field: "layout", value: "page"}
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime"}
      - {label: "更新日期", name: "updated", widget: "datetime", required: false}
      - {label: "页面类型", name: "type", widget: "string", default: "page"}
      - {label: "关键词", name: "keywords", widget: "string", required: false}
      - {label: "描述", name: "description", widget: "text", required: false}
      - {label: "评论", name: "comments", widget: "boolean", default: true, required: false}
      - {label: "内容", name: "body", widget: "markdown"}

  # 配置
  - name: "config"
    label: "网站配置"
    files:
      - name: "general"
        label: "基础配置"
        file: "_config.yml"
        fields:
          - {label: "网站标题", name: "title", widget: "string"}
          - {label: "副标题", name: "subtitle", widget: "string", required: false}
          - {label: "描述", name: "description", widget: "text"}
          - {label: "关键词", name: "keywords", widget: "string", required: false}
          - {label: "作者", name: "author", widget: "string"}
          - {label: "语言", name: "language", widget: "string", default: "zh-CN"}
          - {label: "时区", name: "timezone", widget: "string", default: "Asia/Shanghai"}
          - {label: "网站URL", name: "url", widget: "string"}